<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Nome</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --accent: #38bdf8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #1e3a8a, var(--bg));
      color: var(--text);
    }

    .card {
      background: rgba(30, 41, 59, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 18px;
      padding: 2.5rem 2rem;
      width: min(92vw, 680px);
      text-align: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.3rem);
      color: #fff;
    }

    p {
      margin-top: 1rem;
      font-size: 1.1rem;
      line-height: 1.6;
      color: #cbd5e1;
    }

    .name {
      color: var(--accent);
      font-weight: 700;
    }

    .hint {
      margin-top: 1.5rem;
      font-size: 0.95rem;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Olá, eu sou <span class="name">Seu Nome</span>.</h1>
    <p>Bem-vindo ao meu site pessoal. Aqui você pode conhecer um pouco sobre mim, meus projetos e meus contatos.</p>
    <p class="hint">Edite o texto <strong>Seu Nome</strong> no arquivo <code>index.html</code> para colocar seu nome real.</p>
  </main>
</body>
</html>
